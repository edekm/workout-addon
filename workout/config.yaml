name: Workout
version: "0.7.3"
slug: workout
description: Trening kalisteniki dla dwóch osób - plany, logowanie, progresja
url: https://github.com/edekm/workout-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3000
panel_icon: mdi:dumbbell
panel_title: Workout
homeassistant_api: true
hassio_api: true
map:
  - share:rw
options:
  user1_name: M
  user2_name: Ona
  log_level: info
schema:
  user1_name: str
  user2_name: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
