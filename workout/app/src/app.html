<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Workout</title>
    %sveltekit.head%
  </head>
  <!-- data-sveltekit-reload: pod HA Ingress prefiks URL (/api/hassio_ingress/<token>/)
       nie jest znany SvelteKit (paths.base musi być statyczny w build time, a token
       Ingressa zmienia się per sesja). Bez tego klient-side router próbowałby
       matchować pełną ścieżkę z prefiksem na trasy aplikacji i pokazywał 404
       dla każdej nawigacji. Wymuszamy pełne przeładowanie - HA Ingress strippuje
       prefiks i forwarduje czystą ścieżkę do add-ona. -->
  <body data-sveltekit-reload>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
